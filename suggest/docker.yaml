name: docker
install: sudo apt install docker.io
subcommands:
  - name: run
    description: "Chạy lệnh trong container mới"
    options:
      - names: ["-d", "--detach"]
        description: "Chạy trong nền"
      - names: ["-i", "--interactive"]
        description: "Giữ STDIN mở"
      - names: ["-t", "--tty"]
        description: "Cấp phát pseudo-TTY"
      - names: ["-p", "--publish"]
        description: "Công bố port HOST:CONTAINER"
        args:
          - name: port
      - names: ["-P", "--publish-all"]
        description: "Publish tất cả port được expose"
      - names: ["-v", "--volume"]
        description: "Bind mount một volume"
        args:
          - name: volume
      - names: ["--mount"]
        description: "Gắn một mount hệ tệp"
        args:
          - name: mount
      - names: ["--name"]
        description: "Tên container"
        args:
          - name: name
      - names: ["--rm"]
        description: "Xóa khi thoát"
      - names: ["-e", "--env"]
        description: "Đặt biến môi trường"
        args:
          - name: KEY=VALUE
      - names: ["--env-file"]
        description: "Đọc biến môi trường từ file"
        args:
          - name: file
            sources:
              - type: path
                include: [folder, file]
      - names: ["--network"]
        description: "Kết nối vào network"
        args:
          - name: network
            generator: docker:networks
      - names: ["-w", "--workdir"]
        description: "Thư mục làm việc"
        args:
          - name: dir
      - names: ["-u", "--user"]
        description: "Tên người dùng hoặc UID"
        args:
          - name: user
      - names: ["--entrypoint"]
        description: "Ghi đè ENTRYPOINT"
        args:
          - name: command
      - names: ["--hostname", "-h"]
        description: "Hostname của container"
        args:
          - name: hostname
      - names: ["--cpus"]
        description: "Số CPU"
        args:
          - name: decimal
      - names: ["-m", "--memory"]
        description: "Giới hạn bộ nhớ"
        args:
          - name: bytes
      - names: ["--restart"]
        description: "Chính sách khởi động lại"
        args:
          - name: policy
      - names: ["--privileged"]
        description: "Cấp quyền mở rộng"
      - names: ["--read-only"]
        description: "Hệ tệp root chỉ đọc"
      - names: ["--label", "-l"]
        description: "Đặt label"
        args:
          - name: KEY=VALUE
      - names: ["--link"]
        description: "Liên kết tới container"
        args:
          - name: "name:alias"
      - names: ["--add-host"]
        description: "Thêm ánh xạ host sang IP"
        args:
          - name: "host:IP"
      - names: ["--cap-add"]
        description: "Thêm capability Linux"
        args:
          - name: cap
      - names: ["--cap-drop"]
        description: "Bỏ capability Linux"
        args:
          - name: cap
      - names: ["--cidfile"]
        description: "Ghi CID vào file"
        args:
          - name: file
      - names: ["--dns"]
        description: "Máy chủ DNS tùy chỉnh"
        args:
          - name: DNS
      - names: ["--expose"]
        description: "Expose một port"
        args:
          - name: port
      - names: ["--gpus"]
        description: "Thiết bị GPU cần thêm"
        args:
          - name: gpus
      - names: ["--health-cmd"]
        description: "Lệnh health check"
        args:
          - name: command
      - names: ["--init"]
        description: "Chạy tiến trình init"
      - names: ["--ip"]
        description: "Địa chỉ IPv4"
        args:
          - name: ip
      - names: ["--log-driver"]
        description: "Driver ghi log"
        args:
          - name: driver
      - names: ["--log-opt"]
        description: "Tùy chọn driver ghi log"
        args:
          - name: KEY=VALUE
      - names: ["--pid"]
        description: "Namespace PID"
        args:
          - name: pid
      - names: ["--platform"]
        description: "Đặt platform"
        args:
          - name: platform
      - names: ["--pull"]
        description: "Pull trước khi chạy"
        args:
          - name: policy
      - names: ["--security-opt"]
        description: "Tùy chọn bảo mật"
        args:
          - name: option
      - names: ["--shm-size"]
        description: "Kích thước /dev/shm"
        args:
          - name: bytes
      - names: ["--sig-proxy"]
        description: "Chuyển tiếp signal tới tiến trình"
      - names: ["--stop-signal"]
        description: "Signal dừng"
        args:
          - name: signal
      - names: ["--stop-timeout"]
        description: "Thời gian chờ dừng"
        args:
          - name: int
      - names: ["--tmpfs"]
        description: "Mount tmpfs"
        args:
          - name: dir
      - names: ["--ulimit"]
        description: "Tùy chọn ulimit"
        args:
          - name: ulimit
      - names: ["--userns"]
        description: "Namespace người dùng"
        args:
          - name: string
      - names: ["--uts"]
        description: "Namespace UTS"
        args:
          - name: string
    args:
      - name: image
        generator: docker:images
      - name: command

  - name: exec
    description: "Chạy một command trong một container đang chạy"
    options:
      - names: ["-i", "--interactive"]
        description: "Giữ STDIN mở"
      - names: ["-t", "--tty"]
        description: "Cấp phát pseudo-TTY"
      - names: ["-d", "--detach"]
        description: "Chế độ tách nền"
      - names: ["-e", "--env"]
        description: "Đặt biến môi trường"
        args:
          - name: KEY=VALUE
      - names: ["--env-file"]
        description: "Đọc env từ file"
        args:
          - name: file
      - names: ["-u", "--user"]
        description: "Chạy với người dùng"
        args:
          - name: user
      - names: ["-w", "--workdir"]
        description: "Thư mục làm việc"
        args:
          - name: dir
      - names: ["--privileged"]
        description: "Quyền mở rộng"
      - names: ["--detach-keys"]
        description: "Ghi đè chuỗi phím detach"
        args:
          - name: string
    args:
      - name: container
        generator: docker:running-containers
      - name: command

  - name: ps
    description: "Liệt kê container"
    options:
      - names: ["-a", "--all"]
        description: "Hiển thị tất cả container"
      - names: ["-q", "--quiet"]
        description: "Chỉ hiển thị ID"
      - names: ["-l", "--latest"]
        description: "Hiển thị mới nhất"
      - names: ["-n"]
        description: "Hiển thị n container gần nhất"
        args:
          - name: n
      - names: ["-s", "--size"]
        description: "Hiển thị tổng kích thước file"
      - names: ["-f", "--filter"]
        description: "Bộ lọc"
        args:
          - name: filter
      - names: ["--format"]
        description: "Định dạng output"
        args:
          - name: template
      - names: ["--no-trunc"]
        description: "Không cắt ngắn output"

  - name: images
    description: "Liệt kê image"
    options:
      - names: ["-a", "--all"]
        description: "Hiển thị tất cả image"
      - names: ["-q", "--quiet"]
        description: "Chỉ hiển thị ID"
      - names: ["-f", "--filter"]
        description: "Bộ lọc"
        args:
          - name: filter
      - names: ["--format"]
        description: "Định dạng output"
        args:
          - name: template
      - names: ["--no-trunc"]
        description: "Không cắt ngắn output"
      - names: ["--digests"]
        description: "Hiển thị digest"
    args:
      - name: repository

  - name: build
    description: "Build image từ Dockerfile"
    options:
      - names: ["-t", "--tag"]
        description: "Tên và tùy chọn tag"
        args:
          - name: "name:tag"
      - names: ["-f", "--file"]
        description: "Đường dẫn Dockerfile"
        args:
          - name: file
            sources:
              - type: path
                include: [folder, file]
      - names: ["--no-cache"]
        description: "Build không dùng cache"
      - names: ["--progress"]
        description: "Kiểu output build (auto|plain|tty)"
        args:
          - name: type
      - names: ["--pull"]
        description: "Luôn pull image mới hơn"
      - names: ["--rm"]
        description: "Xóa container trung gian"
      - names: ["--force-rm"]
        description: "Luôn xóa container trung gian"
      - names: ["--build-arg"]
        description: "Biến tại thời điểm build"
        args:
          - name: KEY=VALUE
      - names: ["--target"]
        description: "Stage target khi build"
        args:
          - name: stage
      - names: ["--platform"]
        description: "Platform target"
        args:
          - name: platform
      - names: ["--cache-from"]
        description: "Image dùng cho cache"
        args:
          - name: image
      - names: ["--label"]
        description: "Đặt metadata"
        args:
          - name: KEY=VALUE
      - names: ["--network"]
        description: "Chế độ network cho RUN"
        args:
          - name: mode
      - names: ["-q", "--quiet"]
        description: "Ẩn output build"
      - names: ["--secret"]
        description: "Secret dùng khi build"
        args:
          - name: secret
      - names: ["--ssh"]
        description: "Socket SSH agent"
        args:
          - name: "default|id"
      - names: ["--output", "-o"]
        description: "Đích xuất"
        args:
          - name: path
      - names: ["--squash"]
        description: "Gộp layer (thử nghiệm)"
      - names: ["--iidfile"]
        description: "Ghi ID image vào file"
        args:
          - name: file
    args:
      - name: path
        sources:
          - type: path
            include: [folder]
  - name: pull
    description: "Pull image hoặc repository từ registry"
    options:
      - names: ["-a", "--all-tags"]
        description: "Pull tất cả tag"
      - names: ["-q", "--quiet"]
        description: "Ẩn output chi tiết"
      - names: ["--platform"]
        description: "Đặt platform"
        args:
          - name: platform
      - names: ["--disable-content-trust"]
        description: "Bỏ qua xác minh image"
    args:
      - name: "name:tag"

  - name: push
    description: "Push image hoặc repository lên registry"
    options:
      - names: ["-a", "--all-tags"]
        description: "Push tất cả tag"
      - names: ["-q", "--quiet"]
        description: "Ẩn output chi tiết"
      - names: ["--disable-content-trust"]
        description: "Bỏ qua ký image"
    args:
      - name: "name:tag"
        generator: docker:images

  - name: stop
    description: "Dừng một hoặc nhiều container đang chạy"
    options:
      - names: ["-t", "--time"]
        description: "Số giây trước khi kill (mặc định 10)"
        args:
          - name: int
    args:
      - name: container
        generator: docker:running-containers
        variadic: true

  - name: start
    description: "Khởi động một hoặc nhiều container đã dừng"
    options:
      - names: ["-a", "--attach"]
        description: "Gắn stdout/stderr"
      - names: ["-i", "--interactive"]
        description: "Gắn STDIN của container"
    args:
      - name: container
        generator: docker:all-containers
        variadic: true

  - name: restart
    description: "Khởi động lại một hoặc nhiều container"
    options:
      - names: ["-t", "--time"]
        description: "Số giây trước khi kill"
        args:
          - name: int
    args:
      - name: container
        generator: docker:all-containers
        variadic: true

  - name: rm
    description: "Xóa một hoặc nhiều container"
    options:
      - names: ["-f", "--force"]
        description: "Buộc xóa container đang chạy"
      - names: ["-l", "--link"]
        description: "Xóa liên kết được chỉ định"
      - names: ["-v", "--volumes"]
        description: "Xóa volume ẩn danh"
    args:
      - name: container
        generator: docker:all-containers
        variadic: true

  - name: rmi
    description: "Xóa một hoặc nhiều image"
    options:
      - names: ["-f", "--force"]
        description: "Buộc xóa"
      - names: ["--no-prune"]
        description: "Không xóa parent chưa gắn tag"
    args:
      - name: image
        generator: docker:images
        variadic: true

  - name: logs
    description: "Lấy log của container"
    options:
      - names: ["-f", "--follow"]
        description: "Theo dõi output log"
      - names: ["-n", "--tail"]
        description: "Số dòng tính từ cuối"
        args:
          - name: n
      - names: ["-t", "--timestamps"]
        description: "Hiển thị timestamp"
      - names: ["--since"]
        description: "Hiển thị log kể từ timestamp"
        args:
          - name: timestamp
      - names: ["--until"]
        description: "Hiển thị log trước timestamp"
        args:
          - name: timestamp
      - names: ["--details"]
        description: "Hiển thị chi tiết bổ sung"
    args:
      - name: container
        generator: docker:all-containers

  - name: inspect
    description: "Trả về thông tin cấp thấp về object Docker"
    options:
      - names: ["-f", "--format"]
        description: "Định dạng Go template"
        args:
          - name: template
      - names: ["-s", "--size"]
        description: "Hiển thị tổng kích thước file"
      - names: ["--type"]
        description: "Trả về JSON cho kiểu"
        args:
          - name: type
    args:
      - name: "name|id"
        generator: docker:all-containers
        variadic: true

  - name: attach
    description: "Gắn vào container đang chạy"
    options:
      - names: ["--detach-keys"]
        description: "Ghi đè phím detach"
        args:
          - name: string
      - names: ["--no-stdin"]
        description: "Không gắn STDIN"
      - names: ["--sig-proxy"]
        description: "Chuyển tiếp signal đã nhận"
    args:
      - name: container
        generator: docker:running-containers

  - name: commit
    description: "Tạo image mới từ thay đổi của container"
    options:
      - names: ["-a", "--author"]
        description: "Tác giả"
        args:
          - name: author
      - names: ["-c", "--change"]
        description: "Áp dụng chỉ thị Dockerfile"
        args:
          - name: instruction
      - names: ["-m", "--message"]
        description: "Thông điệp commit"
        args:
          - name: message
      - names: ["-p", "--pause"]
        description: "Tạm dừng container trong lúc commit"
    args:
      - name: container
        generator: docker:all-containers
      - name: "repository:tag"

  - name: cp
    description: "Sao chép tệp/thư mục giữa container và hệ tệp local"
    options:
      - names: ["-a", "--archive"]
        description: "Chế độ archive (sao chép toàn bộ thông tin uid/gid)"
      - names: ["-L", "--follow-link"]
        description: "Luôn đi theo liên kết tượng trưng"
      - names: ["-q", "--quiet"]
        description: "Ẩn output tiến trình"
    args:
      - name: "CONTAINER:SRC_PATH or SRC_PATH"
      - name: "DEST_PATH or CONTAINER:DEST_PATH"

  - name: create
    description: "Tạo container mới"
    options:
      - names: ["--name"]
        description: "Tên container"
        args:
          - name: name
      - names: ["-p", "--publish"]
        description: "Công bố port(s)"
        args:
          - name: port
      - names: ["-v", "--volume"]
        description: "Bind mount volume"
        args:
          - name: volume
      - names: ["-e", "--env"]
        description: "Đặt biến môi trường"
        args:
          - name: KEY=VALUE
      - names: ["--network"]
        description: "Kết nối vào network"
        args:
          - name: network
      - names: ["-u", "--user"]
        description: "Tên người dùng hoặc UID"
        args:
          - name: user
      - names: ["--entrypoint"]
        description: "Ghi đè ENTRYPOINT"
        args:
          - name: cmd
      - names: ["--restart"]
        description: "Chính sách khởi động lại"
        args:
          - name: policy
      - names: ["-w", "--workdir"]
        description: "Thư mục làm việc"
        args:
          - name: dir
    args:
      - name: image
        generator: docker:images
      - name: command

  - name: diff
    description: "Kiểm tra thay đổi file trên hệ tệp của container"
    args:
      - name: container
        generator: docker:all-containers

  - name: events
    description: "Lấy sự kiện thời gian thực từ server"
    options:
      - names: ["-f", "--filter"]
        description: "Lọc theo điều kiện"
        args:
          - name: filter
      - names: ["--format"]
        description: "Định dạng Go template"
        args:
          - name: template
      - names: ["--since"]
        description: "Hiển thị events since timestamp"
        args:
          - name: string
      - names: ["--until"]
        description: "Stream sự kiện đến timestamp"
        args:
          - name: string

  - name: export
    description: "Export hệ tệp của container thành archive tar"
    options:
      - names: ["-o", "--output"]
        description: "Ghi tới file"
        args:
          - name: file
    args:
      - name: container
        generator: docker:all-containers

  - name: history
    description: "Hiển thị lịch sử của image"
    options:
      - names: ["-H", "--human"]
        description: "Kích thước dễ đọc"
      - names: ["--no-trunc"]
        description: "Không cắt ngắn output"
      - names: ["-q", "--quiet"]
        description: "Chỉ hiển thị ID image"
      - names: ["--format"]
        description: "Định dạng Go template"
        args:
          - name: template
    args:
      - name: image
        generator: docker:images

  - name: info
    description: "Hiển thị thông tin toàn hệ thống"
    options:
      - names: ["-f", "--format"]
        description: "Định dạng Go template"
        args:
          - name: template

  - name: kill
    description: "Kill một hoặc nhiều container đang chạy"
    options:
      - names: ["-s", "--signal"]
        description: "Signal cần gửi (mặc định KILL)"
        args:
          - name: signal
    args:
      - name: container
        generator: docker:running-containers
        variadic: true

  - name: load
    description: "Load image từ archive tar hoặc STDIN"
    options:
      - names: ["-i", "--input"]
        description: "Đọc từ file archive tar"
        args:
          - name: file
            sources:
              - type: path
                include: [folder, file]
      - names: ["-q", "--quiet"]
        description: "Ẩn output load"

  - name: login
    description: "Đăng nhập vào Docker registry"
    options:
      - names: ["-p", "--password"]
        description: "Mật khẩu"
        args:
          - name: password
      - names: ["--password-stdin"]
        description: "Nhận mật khẩu từ stdin"
      - names: ["-u", "--username"]
        description: "Tên người dùng"
        args:
          - name: username
    args:
      - name: server

  - name: logout
    description: "Đăng xuất khỏi Docker registry"
    args:
      - name: server

  - name: pause
    description: "Tạm dừng tất cả tiến trình trong một hoặc nhiều container"
    args:
      - name: container
        generator: docker:running-containers
        variadic: true

  - name: unpause
    description: "Tiếp tục tất cả tiến trình trong một hoặc nhiều container"
    args:
      - name: container
        generator: docker:all-containers
        variadic: true

  - name: port
    description: "Liệt kê ánh xạ port của container"
    args:
      - name: container
        generator: docker:all-containers
      - name: private_port

  - name: rename
    description: "Đổi tên container"
    args:
      - name: container
        generator: docker:all-containers
      - name: new_name

  - name: save
    description: "Lưu một hoặc nhiều image vào archive tar"
    options:
      - names: ["-o", "--output"]
        description: "Ghi tới file"
        args:
          - name: file
    args:
      - name: image
        generator: docker:images
        variadic: true

  - name: search
    description: "Tìm image trên Docker Hub"
    options:
      - names: ["-f", "--filter"]
        description: "Lọc theo điều kiện"
        args:
          - name: filter
      - names: ["--format"]
        description: "Định dạng Go template"
        args:
          - name: template
      - names: ["--limit"]
        description: "Số kết quả tìm kiếm tối đa (mặc định 25)"
        args:
          - name: int
      - names: ["--no-trunc"]
        description: "Không cắt ngắn output"
    args:
      - name: term

  - name: stats
    description: "Hiển thị thống kê sử dụng resource trực tiếp"
    options:
      - names: ["-a", "--all"]
        description: "Hiển thị tất cả container"
      - names: ["--no-stream"]
        description: "Tắt streaming, chỉ hiển thị một lần"
      - names: ["--no-trunc"]
        description: "Không cắt ngắn output"
      - names: ["--format"]
        description: "Định dạng Go template"
        args:
          - name: template
    args:
      - name: container
        generator: docker:running-containers

  - name: tag
    description: "Tạo tag TARGET_IMAGE trỏ tới SOURCE_IMAGE"
    args:
      - name: source_image
        generator: docker:images
      - name: target_image

  - name: top
    description: "Hiển thị tiến trình đang chạy của container"
    args:
      - name: container
        generator: docker:running-containers
      - name: ps_options

  - name: update
    description: "Cập nhật cấu hình của một hoặc nhiều container"
    options:
      - names: ["--cpus"]
        description: "Số CPU"
        args:
          - name: decimal
      - names: ["-m", "--memory"]
        description: "Giới hạn bộ nhớ"
        args:
          - name: bytes
      - names: ["--memory-swap"]
