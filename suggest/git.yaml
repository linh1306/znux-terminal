        description: "Chỉ dùng tag khớp"
        args:
          - name: pattern
      - names: ["--exclude"]
        description: "Loại trừ tag khớp"
        args:
          - name: pattern
      - names: ["--dirty"]
        description: "Thêm -dirty nếu có thay đổi bẩn"
        args:
          - name: mark
      - names: ["--all"]
        description: "Dùng bất kỳ ref nào"
    args:
      - name: commit
        generator: git:branches

  - name: reflog
    description: "Quản lý thông tin reflog"
    subcommands:
      - name: show
        description: "Hiển thị reflog"
        args:
          - name: ref
            generator: git:branches
      - name: expire
        description: "Prune entry cũ"
        options:
          - names: ["--expire"]
            description: "Hết hạn entry cũ hơn"
            args:
              - name: time
          - names: ["--all"]
            description: "Xử lý tất cả ref"
      - name: delete
        description: "Xóa entry reflog"
        args:
          - name: ref
      - name: exists
        description: "Kiểm tra ref có reflog không"
        args:
          - name: ref
    options:
      - names: ["--date"]
        description: "Định dạng ngày"
        args:
          - name: format
    args:
      - name: ref
        generator: git:branches

  - name: worktree
    description: "Quản lý nhiều working tree"
    subcommands:
      - name: add
        description: "Tạo worktree"
        options:
          - names: ["-b"]
            description: "Tạo nhánh"
            args:
              - name: branch
          - names: ["-B"]
            description: "Tạo hoặc buộc tạo nhánh"
            args:
              - name: branch
          - names: ["--detach"]
            description: "Tách HEAD"
          - names: ["--track"]
            description: "Thiết lập tracking"
          - names: ["-f", "--force"]
            description: "Buộc thêm"
        args:
          - name: path
          - name: commit-ish
            generator: git:branches
      - name: list
        description: "Liệt kê worktree"
      - name: remove
        description: "Xóa worktree"
        options:
          - names: ["-f", "--force"]
            description: "Buộc xóa"
        args:
          - name: worktree
      - name: prune
        description: "Prune thông tin worktree"
        options:
          - names: ["-n", "--dry-run"]
            description: "Chạy thử"
          - names: ["-v", "--verbose"]
            description: "Xuất chi tiết"
          - names: ["--expire"]
            description: "Hết hạn file admin cũ hơn"
            args:
              - name: time
      - name: lock
        description: "Khóa worktree"
        options:
          - names: ["--reason"]
            description: "Lý do khóa"
            args:
              - name: string
        args:
          - name: worktree
      - name: unlock
        description: "Mở khóa worktree"
        args:
          - name: worktree
      - name: move
        description: "Di chuyển worktree"
        args:
          - name: worktree
          - name: new-path
      - name: repair
        description: "Sửa file admin của worktree"
        args:
          - name: path
            variadic: true

options:
  - names: ["-C"]
    description: "Chạy như thể được bắt đầu trong đường dẫn"
    args:
      - name: path
  - names: ["--version"]
    description: "In phiên bản git"
  - names: ["--help"]
    description: "In trợ giúp"
  - names: ["-c"]
    description: "Truyền tham số config"
    args:
      - name: name=value
  - names: ["--exec-path"]
    description: "Đường dẫn tới chương trình git core"
  - names: ["--git-dir"]
    description: "Đặt đường dẫn tới repository"
    args:
      - name: path
  - names: ["--work-tree"]
    description: "Đặt đường dẫn working tree"
    args:
      - name: path
  - names: ["--no-pager"]
    description: "Không pipe output qua pager"
  - names: ["--paginate", "-p"]
    description: "Pipe output qua pager"
  - names: ["--no-replace-objects"]
    description: "Không dùng replacement ref"
