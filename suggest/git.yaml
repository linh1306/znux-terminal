name: git
subcommands:
  - name: add
    description: "Thêm nội dung file vào index"
    options:
      - names: ["-A", "--all"]
        description: "Thêm tất cả file"
      - names: ["-p", "--patch"]
        description: "Chọn hunk theo cách tương tác"
      - names: ["-n", "--dry-run"]
        description: "Hiển thị những gì sẽ được thêm"
      - names: ["-u", "--update"]
        description: "Cập nhật file đã được theo dõi"
      - names: ["-f", "--force"]
        description: "Cho phép thêm file bị ignore"
      - names: ["-i", "--interactive"]
        description: "Chế độ tương tác"
      - names: ["-e", "--edit"]
        description: "Mở diff trong editor"
      - names: ["--chmod"]
        description: "Ghi đè mode file (+x hoặc -x)"
    args:
      - name: pathspec
        sources:
          - type: path
            include: [folder, file]
  - name: status
    description: "Hiển thị trạng thái working tree"
    options:
      - names: ["-s", "--short"]
        description: "Xuất ở định dạng ngắn"
      - names: ["-b", "--branch"]
        description: "Hiển thị nhánh và thông tin tracking"
      - names: ["-u", "--untracked-files"]
        description: "Hiển thị file chưa được theo dõi"
      - names: ["--porcelain"]
        description: "Output máy đọc được"
      - names: ["--ignored"]
        description: "Hiển thị file bị ignore"

  - name: commit
    description: "Ghi nhận thay đổi vào repository"
    options:
      - names: ["-m", "--message"]
        description: "Thông điệp commit"
        args:
          - name: message
      - names: ["-a", "--all"]
        description: "Tự động stage file đã sửa"
      - names: ["--amend"]
        description: "Sửa commit trước đó"
      - names: ["--no-edit"]
        description: "Dùng thông điệp commit đã chọn mà không sửa"
      - names: ["-C", "--reuse-message"]
        description: "Dùng lại thông điệp commit"
        args:
          - name: commit
            generator: git:branches
      - names: ["--allow-empty"]
        description: "Cho phép commit rỗng"
      - names: ["--allow-empty-message"]
        description: "Cho phép thông điệp commit rỗng"
      - names: ["-s", "--signoff"]
        description: "Thêm Signed-off-by"
      - names: ["--no-gpg-sign"]
        description: "Không ký GPG cho commit"
      - names: ["-n", "--no-verify"]
        description: "Bỏ qua hook pre-commit"
      - names: ["--fixup"]
        description: "Tạo commit fixup"
        args:
          - name: commit
            generator: git:branches
      - names: ["--squash"]
        description: "Tạo commit squash"
        args:
          - name: commit
            generator: git:branches

  - name: push
    description: "Cập nhật ref trên remote"
    options:
      - names: ["-u", "--set-upstream"]
        description: "Đặt upstream cho nhánh"
      - names: ["-f", "--force"]
        description: "Buộc push"
      - names: ["--force-with-lease"]
        description: "Buộc push nếu remote khớp kỳ vọng"
      - names: ["--tags"]
        description: "Push tất cả tag"
      - names: ["--all"]
        description: "Push tất cả nhánh"
      - names: ["-d", "--delete"]
        description: "Xóa ref trên remote"
      - names: ["--dry-run"]
        description: "Hiển thị những gì sẽ được push"
      - names: ["-n"]
        description: "Chạy thử"
      - names: ["--follow-tags"]
        description: "Push các annotated tag có thể tới được"
      - names: ["--no-verify"]
        description: "Bỏ qua hook pre-push"
      - names: ["--atomic"]
        description: "Yêu cầu transaction atomic"
    args:
      - name: remote
        generator: git:remotes
      - name: branch
        generator: git:local-branches

  - name: pull
    description: "Fetch và tích hợp với repository khác"
    options:
      - names: ["--rebase"]
        description: "Rebase thay vì merge"
      - names: ["--no-rebase"]
        description: "Merge thay vì rebase"
      - names: ["--no-commit"]
        description: "Thực hiện merge nhưng không commit"
      - names: ["--ff-only"]
        description: "Chỉ fast-forward"
      - names: ["--all"]
        description: "Fetch tất cả remote"
      - names: ["--tags"]
        description: "Fetch tất cả tag"
      - names: ["--prune"]
        description: "Xóa nhánh remote đã bị xóa"
      - names: ["--squash"]
        description: "Squash thành một commit"
      - names: ["-v", "--verbose"]
        description: "Output chi tiết"
    args:
      - name: remote
        generator: git:remotes
      - name: branch
        generator: git:branches

  - name: fetch
    description: "Tải object và ref từ repository khác"
    options:
      - names: ["--all"]
        description: "Fetch tất cả remote"
      - names: ["--prune"]
        description: "Xóa nhánh remote đã bị xóa"
      - names: ["--tags"]
        description: "Fetch tất cả tag"
      - names: ["-f", "--force"]
        description: "Buộc fetch"
      - names: ["-v", "--verbose"]
        description: "Xuất chi tiết"
      - names: ["--depth"]
        description: "Tăng độ sâu fetch"
        args:
          - name: depth
      - names: ["--unshallow"]
        description: "Chuyển shallow thành đầy đủ"
      - names: ["--dry-run"]
        description: "Hiển thị những gì sẽ được fetch"
    args:
      - name: remote
        generator: git:remotes

  - name: checkout
    description: "Chuyển nhánh hoặc khôi phục file trong working tree"
    options:
      - names: ["-b"]
        description: "Tạo và chuyển sang nhánh mới"
        args:
          - name: branch
      - names: ["-B"]
        description: "Tạo/reset và chuyển sang một nhánh"
        args:
          - name: branch
      - names: ["-t", "--track"]
        description: "Thiết lập chế độ tracking"
      - names: ["--orphan"]
        description: "Tạo nhánh orphan"
        args:
          - name: branch
      - names: ["-f", "--force"]
        description: "Buộc checkout"
      - names: ["-p", "--patch"]
        description: "Chọn hunk theo cách tương tác"
      - names: ["--"]
        description: "Xem các đối số còn lại là đường dẫn file"
    args:
      - name: branch
        generator: git:branches
        variadic: true

  - name: switch
    description: "Chuyển nhánh"
    options:
      - names: ["-c", "--create"]
        description: "Tạo và chuyển sang nhánh mới"
        args:
          - name: branch
      - names: ["-C", "--force-create"]
        description: "Tạo/reset và chuyển sang một nhánh"
        args:
          - name: branch
      - names: ["-t", "--track"]
        description: "Thiết lập tracking"
      - names: ["--orphan"]
        description: "Tạo nhánh orphan"
        args:
          - name: branch
      - names: ["-d", "--detach"]
        description: "Tách HEAD"
      - names: ["-f", "--force"]
        description: "Buộc chuyển nhánh"
      - names: ["--discard-changes"]
        description: "Loại bỏ thay đổi local"
    args:
      - name: branch
        generator: git:branches

  - name: branch
    description: "Liệt kê, tạo hoặc xóa nhánh"
    options:
      - names: ["-a", "--all"]
        description: "Liệt kê cả nhánh remote và local"
      - names: ["-r", "--remotes"]
        description: "Liệt kê nhánh remote"
      - names: ["-d", "--delete"]
        description: "Xóa nhánh"
      - names: ["-D"]
        description: "Buộc xóa nhánh"
      - names: ["-m", "--move"]
        description: "Đổi tên nhánh"
      - names: ["-M"]
        description: "Buộc đổi tên nhánh"
      - names: ["-c", "--copy"]
        description: "Sao chép nhánh"
      - names: ["-v", "--verbose"]
        description: "Hiển thị hash commit và subject"
      - names: ["--merged"]
        description: "Liệt kê nhánh đã merge vào HEAD"
      - names: ["--no-merged"]
        description: "Liệt kê nhánh chưa merge vào HEAD"
      - names: ["--contains"]
        description: "Liệt kê nhánh chứa commit"
        args:
          - name: commit
      - names: ["-u", "--set-upstream-to"]
        description: "Đặt upstream"
        args:
          - name: upstream
      - names: ["--unset-upstream"]
        description: "Xóa cấu hình upstream"
      - names: ["--sort"]
        description: "Thứ tự sắp xếp"
        args:
          - name: key
    args:
      - name: branch
        generator: git:branches

  - name: merge
    description: "Kết hợp hai hoặc nhiều lịch sử phát triển"
    options:
      - names: ["--no-ff"]
        description: "Tạo merge commit kể cả khi có thể fast-forward"
      - names: ["--ff-only"]
        description: "Chỉ fast-forward"
      - names: ["--squash"]
        description: "Squash tất cả commit thành một"
      - names: ["--abort"]
        description: "Hủy merge hiện tại"
      - names: ["--continue"]
        description: "Tiếp tục sau khi resolve conflict"
      - names: ["-m"]
        description: "Thông điệp commit"
        args:
          - name: message
      - names: ["--strategy"]
        description: "Chiến lược merge"
        args:
          - name: strategy
      - names: ["-v", "--verbose"]
        description: "Xuất chi tiết"
      - names: ["--stat"]
        description: "Hiển thị diffstat"
      - names: ["--no-stat"]
        description: "Không hiển thị diffstat"
      - names: ["--log"]
        description: "Bao gồm thông điệp log"
    args:
      - name: branch
        generator: git:branches

  - name: rebase
    description: "Áp dụng lại commit lên một base khác"
    options:
      - names: ["-i", "--interactive"]
        description: "Rebase tương tác"
      - names: ["--continue"]
        description: "Tiếp tục sau khi resolve conflict"
      - names: ["--abort"]
        description: "Hủy rebase"
      - names: ["--skip"]
        description: "Bỏ qua patch hiện tại"
      - names: ["--quit"]
        description: "Hủy nhưng giữ HEAD"
      - names: ["--autosquash"]
        description: "Tự động squash commit fixup"
      - names: ["--autostash"]
        description: "Stash trước khi rebase và pop sau đó"
      - names: ["--no-autostash"]
        description: "Không autostash"
      - names: ["--onto"]
        description: "Rebase lên"
        args:
          - name: newbase
            generator: git:branches
      - names: ["-m", "--merge"]
        description: "Dùng chiến lược merge"
      - names: ["--strategy"]
        description: "Dùng chiến lược merge được chỉ định"
        args:
          - name: strategy
      - names: ["--exec"]
        description: "Thực thi lệnh sau mỗi commit"
        args:
          - name: cmd
      - names: ["--root"]
        description: "Rebase từ root"
      - names: ["--keep-base"]
        description: "Giữ commit base"
    args:
      - name: branch
        generator: git:branches

  - name: cherry-pick
    description: "Áp dụng thay đổi được giới thiệu bởi các commit hiện có"
    options:
      - names: ["-e", "--edit"]
        description: "Sửa thông điệp commit"
      - names: ["-n", "--no-commit"]
        description: "Áp dụng thay đổi mà không commit"
      - names: ["-x"]
        description: "Thêm thông tin commit nguồn vào thông điệp"
      - names: ["-s", "--signoff"]
        description: "Thêm Signed-off-by"
      - names: ["--continue"]
        description: "Tiếp tục sau khi resolve conflict"
      - names: ["--abort"]
        description: "Hủy cherry-pick"
      - names: ["--quit"]
        description: "Quên thao tác hiện tại"
      - names: ["--skip"]
        description: "Bỏ qua commit hiện tại"
      - names: ["-m", "--mainline"]
        description: "Số parent mainline"
        args:
          - name: parent-number
      - names: ["--strategy"]
        description: "Chiến lược merge"
        args:
          - name: strategy
    args:
      - name: commit
        generator: git:branches
        variadic: true

  - name: log
    description: "Hiển thị log commit"
    options:
      - names: ["--oneline"]
        description: "Mỗi commit một dòng"
      - names: ["--graph"]
        description: "Hiển thị graph ASCII"
      - names: ["-n", "--max-count"]
        description: "Giới hạn số commit"
        args:
          - name: number
      - names: ["--author"]
        description: "Lọc theo tác giả"
        args:
          - name: author
      - names: ["--since", "--after"]
        description: "Hiển thị commit sau ngày"
        args:
          - name: date
      - names: ["--until", "--before"]
        description: "Hiển thị commit trước ngày"
        args:
          - name: date
      - names: ["--grep"]
        description: "Lọc theo thông điệp commit"
        args:
          - name: pattern
      - names: ["-p", "--patch"]
        description: "Hiển thị patch cho từng commit"
      - names: ["--stat"]
        description: "Hiển thị stats"
      - names: ["--name-only"]
        description: "Chỉ hiển thị tên file"
      - names: ["--name-status"]
        description: "Hiển thị tên file và trạng thái"
      - names: ["--abbrev-commit"]
        description: "Rút gọn hash commit"
      - names: ["--decorate"]
        description: "Hiển thị tên ref"
      - names: ["--all"]
        description: "Hiển thị tất cả nhánh"
      - names: ["--follow"]
        description: "Theo dõi đổi tên file"
      - names: ["--merges"]
        description: "Chỉ hiển thị commit merge"
      - names: ["--no-merges"]
        description: "Bỏ qua commit merge"
      - names: ["--first-parent"]
        description: "Chỉ theo parent đầu tiên"
      - names: ["--reverse"]
        description: "Hiển thị theo thứ tự ngược"
      - names: ["-S"]
        description: "Tìm thay đổi đối với chuỗi"
        args:
          - name: string
      - names: ["--format", "--pretty"]
        description: "Định dạng pretty-print"
        args:
          - name: format
    args:
      - name: revision

  - name: diff
    description: "Hiển thị thay đổi giữa commit, giữa commit và working tree, v.v."
    options:
      - names: ["--staged", "--cached"]
        description: "Hiển thị thay đổi đã stage"
      - names: ["--name-only"]
        description: "Chỉ hiển thị tên file đã thay đổi"
      - names: ["--name-status"]
        description: "Hiển thị tên và trạng thái"
      - names: ["--stat"]
        description: "Hiển thị diffstat"
      - names: ["-p", "--patch"]
        description: "Tạo patch"
      - names: ["--no-patch", "-s"]
        description: "Ẩn output patch"
      - names: ["-w", "--ignore-all-space"]
        description: "Bỏ qua khoảng trắng"
      - names: ["-b", "--ignore-space-change"]
        description: "Bỏ qua thay đổi khoảng trắng"
      - names: ["--word-diff"]
        description: "Hiển thị diff theo từ"
      - names: ["--color-words"]
        description: "Tô sáng thay đổi theo từ"
      - names: ["--check"]
        description: "Kiểm tra lỗi khoảng trắng"
      - names: ["--shortstat"]
        description: "Chỉ shortstat"
      - names: ["-U", "--unified"]
        description: "Số dòng ngữ cảnh"
        args:
          - name: n
    args:
      - name: commit
        generator: git:branches
      - name: commit
        generator: git:branches

  - name: stash
    description: "Stash thay đổi trong working directory đang bẩn"
    subcommands:
      - name: push
        description: "Lưu thay đổi vào stash"
        options:
          - names: ["-m", "--message"]
            description: "Thông điệp stash"
            args:
              - name: message
          - names: ["-u", "--include-untracked"]
            description: "Bao gồm file chưa theo dõi"
          - names: ["-a", "--all"]
            description: "Bao gồm file bị ignore"
          - names: ["-p", "--patch"]
            description: "Chọn tương tác"
          - names: ["-k", "--keep-index"]
            description: "Giữ index"
        args:
          - name: pathspec
            sources:
              - type: path
                include: [folder, file]
      - name: pop
        description: "Áp dụng và xóa stash"
        options:
          - names: ["--index"]
            description: "Thử khôi phục index"
          - names: ["-q", "--quiet"]
            description: "Im lặng"
      - name: apply
        description: "Áp dụng stash mà không xóa"
        options:
          - names: ["--index"]
            description: "Khôi phục trạng thái index"
      - name: list
        description: "Liệt kê tất cả stash"
      - name: drop
        description: "Xóa stash"
        args:
          - name: stash
      - name: show
        description: "Hiển thị diff của stash"
        options:
          - names: ["-p", "--patch"]
            description: "Hiển thị patch"
          - names: ["--stat"]
            description: "Hiển thị stat"
        args:
          - name: stash
      - name: clear
        description: "Xóa tất cả stash"
      - name: branch
        description: "Tạo nhánh từ stash"
        args:
          - name: branch
          - name: stash

  - name: reset
    description: "Reset HEAD hiện tại về trạng thái được chỉ định"
    options:
      - names: ["--soft"]
        description: "Giữ thay đổi ở trạng thái staged"
      - names: ["--mixed"]
        description: "Giữ thay đổi ở trạng thái unstaged (mặc định)"
      - names: ["--hard"]
        description: "Loại bỏ tất cả thay đổi"
      - names: ["--merge"]
        description: "Reset và giữ thay đổi chưa commit"
      - names: ["--keep"]
        description: "Reset nhưng giữ thay đổi local"
      - names: ["-N", "--intent-to-add"]
        description: "Ghi nhận ý định thêm"
      - names: ["-p", "--patch"]
        description: "Chọn tương tác"
      - names: ["-q", "--quiet"]
        description: "Im lặng"
    args:
      - name: commit
        generator: git:branches
      - name: pathspec
        sources:
          - type: path
            include: [folder, file]
  - name: restore
    description: "Khôi phục file trong working tree"
    options:
      - names: ["-s", "--source"]
        description: "Khôi phục từ nguồn"
        args:
          - name: tree
      - names: ["-S", "--staged"]
        description: "Khôi phục nội dung đã stage"
      - names: ["-W", "--worktree"]
        description: "Khôi phục working tree"
      - names: ["-p", "--patch"]
        description: "Chọn tương tác"
      - names: ["--ours"]
        description: "Dùng phiên bản ours khi conflict"
      - names: ["--theirs"]
        description: "Dùng phiên bản theirs khi conflict"
    args:
      - name: pathspec
        sources:
          - type: path
            include: [folder, file]
        variadic: true

  - name: remote
    description: "Quản lý tập repository được theo dõi"
    subcommands:
      - name: add
        description: "Thêm remote"
        options:
          - names: ["-f", "--fetch"]
            description: "Fetch sau khi thêm"
          - names: ["-t"]
            description: "Theo dõi nhánh"
            args:
              - name: branch
        args:
          - name: name
          - name: url
      - name: remove
        description: "Xóa remote"
        args:
          - name: name
            generator: git:remotes
      - name: rename
        description: "Đổi tên remote"
        args:
          - name: old
            generator: git:remotes
          - name: new
      - name: set-url
        description: "Đổi URL remote"
        options:
          - names: ["--push"]
            description: "Đổi URL push"
          - names: ["--add"]
            description: "Thêm URL thay vì thay thế"
          - names: ["--delete"]
            description: "Xóa URL khớp"
        args:
          - name: name
            generator: git:remotes
          - name: newurl
      - name: get-url
        description: "Lấy URL remote"
        options:
          - names: ["--push"]
            description: "Hiển thị URL push"
          - names: ["--all"]
            description: "Hiển thị tất cả URL"
        args:
          - name: name
            generator: git:remotes
      - name: show
        description: "Hiển thị thông tin về remote"
        args:
          - name: name
            generator: git:remotes
      - name: prune
        description: "Xóa nhánh remote-tracking đã cũ"
        options:
          - names: ["-n", "--dry-run"]
            description: "Chạy thử"
        args:
          - name: name
            generator: git:remotes
      - name: update
        description: "Fetch cập nhật cho remote"
        args:
          - name: group
    options:
      - names: ["-v", "--verbose"]
        description: "Hiển thị URL remote"

  - name: tag
    description: "Tạo, liệt kê, xóa hoặc xác minh tag"
    options:
      - names: ["-a", "--annotate"]
        description: "Tạo annotated tag"
      - names: ["-d", "--delete"]
        description: "Xóa tag"
      - names: ["-m", "--message"]
        description: "Thông điệp tag"
        args:
          - name: message
      - names: ["-f", "--force"]
        description: "Buộc thay thế tag hiện có"
      - names: ["-l", "--list"]
        description: "Liệt kê tag"
      - names: ["-v", "--verify"]
        description: "Xác minh chữ ký GPG"
      - names: ["--sort"]
        description: "Thứ tự sắp xếp"
        args:
          - name: key
      - names: ["--contains"]
        description: "Chỉ các tag chứa commit"
        args:
          - name: commit
      - names: ["-n"]
        description: "In các dòng annotation"
        args:
          - name: num
    args:
      - name: tagname

  - name: show
    description: "Hiển thị nhiều loại object"
    options:
      - names: ["--stat"]
        description: "Hiển thị diffstat"
      - names: ["--name-only"]
