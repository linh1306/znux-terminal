name: go
subcommands:
  - name: run
    description: Compile and run Go file
    options:
      - names: ["-v", "--verbose"]
        description: Verbose
      - names: ["-x"]
        description: Print commands

  - name: build
    description: Compile packages
    options:
      - names: ["-v", "--verbose"]
        description: Verbose
      - names: ["-x"]
        description: Print commands
      - names: ["-o", "--output"]
        description: Output file
      - names: ["-a", "--all"]
        description: Force rebuild
      - names: ["-race"]
        description: Race detector
      - names: ["-ldflags"]
        description: Linker flags
      - names: ["-gcflags"]
        description: Compiler flags
      - names: ["-tags"]
        description: Build tags

  - name: test
    description: Run tests
    options:
      - names: ["-v", "--verbose"]
        description: Verbose
      - names: ["-run"]
        description: Run tests matching regex
      - names: ["-bench"]
        description: Run benchmarks matching regex
      - names: ["-benchtime"]
        description: Benchmark time
      - names: ["-count"]
        description: Run count
      - names: ["-cover"]
        description: Coverage
      - names: ["-coverprofile"]
        description: Coverage profile
      - names: ["-race"]
        description: Race detector
      - names: ["-timeout"]
        description: Timeout
      - names: ["-short"]
        description: Short mode

  - name: vet
    description: Run go vet
    options:
      - names: ["-v"]
        description: Verbose

  - name: fmt
    description: Format packages
    options:
      - names: ["-l", "--list"]
        description: List files
      - names: ["-w", "--write"]
        description: Write result
      - names: ["-r"]
        description: Rewrite rule

  - name: mod
    description: Module maintenance
    options:
      - names: ["init"]
        description: Initialize go.mod
      - names: ["tidy"]
        description: Update go.mod
      - names: ["download"]
        description: Download modules
      - names: ["graph"]
        description: Module graph
      - names: ["why"]
        description: Explain dependencies

  - name: get
    description: Add dependency
    options:
      - names: ["-v", "--verbose"]
        description: Verbose
      - names: ["-u"]
        description: Update

  - name: install
    description: Build and install packages
    options:
      - names: ["-v"]
        description: Verbose
      - names: ["-race"]
        description: Race detector

  - name: clean
    description: Clean cache
    options:
      - names: ["-cache"]
        description: Clean build cache
      - names: ["-testcache"]
        description: Clean test cache
      - names: ["-modcache"]
        description: Clean module cache

  - name: doc
    description: Show documentation
    options:
      - names: ["-v", "--verbose"]
        description: Verbose
      - names: ["-all"]
        description: Show unexported

  - name: list
    description: List packages
    options:
      - names: ["-m"]
        description: List modules
      - names: ["-f"]
        description: Format
      - names: ["-templates"]
        description: Templates

  - name: version
    description: Print Go version

  - name: env
    description: Print environment
    options:
      - names: ["-json"]
        description: JSON output
      - names: ["-w"]
        description: Set env vars
