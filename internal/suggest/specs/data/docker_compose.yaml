name: docker-compose
subcommands:
  - name: up
    description: Create and start containers
    options:
      - names: ["-d", "--detach"]
        description: "Detached mode: run in background"
      - names: ["--build"]
        description: Build images before starting containers
      - names: ["--no-build"]
        description: "Don't build an image, even if it's missing"
      - names: ["--force-recreate"]
        description: Recreate containers even if config hasn't changed
      - names: ["--no-recreate"]
        description: Don't recreate existing containers
      - names: ["--no-start"]
        description: Don't start the services after creating them
      - names: ["--remove-orphans"]
        description: Remove containers for undefined services
      - names: ["--scale"]
        description: Scale service to NUM instances
        args:
          - name: "service=n"
      - names: ["-t", "--timeout"]
        description: Shutdown timeout in seconds
        args:
          - name: int
      - names: ["--wait"]
        description: Wait for services to be running/healthy
      - names: ["--no-color"]
        description: Produce monochrome output
      - names: ["--no-log-prefix"]
        description: Don't print prefix in logs
      - names: ["--no-deps"]
        description: Don't start linked services
      - names: ["--abort-on-container-exit"]
        description: Stop all containers if any stopped
      - names: ["--exit-code-from"]
        description: Return exit code of selected service
        args:
          - name: service
      - names: ["--quiet-pull"]
        description: Pull without printing progress
      - names: ["-V", "--renew-anon-volumes"]
        description: Recreate anonymous volumes
      - names: ["--always-recreate-deps"]
        description: Recreate dependent containers
      - names: ["--attach"]
        description: Attach to service output
        args:
          - name: service
      - names: ["--attach-dependencies"]
        description: Attach to dependent containers
    args:
      - name: service
        variadic: true

  - name: down
    description: "Stop and remove containers, networks"
    options:
      - names: ["--remove-orphans"]
        description: Remove containers for undefined services
      - names: ["--rmi"]
        description: "Remove images used by services (local|all)"
        args:
          - name: type
      - names: ["-t", "--timeout"]
        description: Shutdown timeout in seconds
        args:
          - name: int
      - names: ["-v", "--volumes"]
        description: Remove named volumes and anonymous volumes

  - name: build
    description: Build or rebuild services
    options:
      - names: ["--no-cache"]
        description: Do not use cache when building
      - names: ["--pull"]
        description: Always attempt to pull newer image
      - names: ["-q", "--quiet"]
        description: Don't print anything to STDOUT
      - names: ["--build-arg"]
        description: Set build-time variables
        args:
          - name: KEY=VALUE
      - names: ["--progress"]
        description: "Set type of progress output (auto|tty|plain|quiet)"
        args:
          - name: type
      - names: ["--ssh"]
        description: Set SSH authentications
        args:
          - name: ssh
      - names: ["-m", "--memory"]
        description: Set memory limit for build container
        args:
          - name: memory
    args:
      - name: service
        variadic: true

  - name: logs
    description: View output from containers
    options:
      - names: ["-f", "--follow"]
        description: Follow log output
      - names: ["-t", "--timestamps"]
        description: Show timestamps
      - names: ["--tail"]
        description: Number of lines from end
        args:
          - name: lines
      - names: ["--since"]
        description: Show logs since timestamp
        args:
          - name: timestamp
      - names: ["--until"]
        description: Show logs before timestamp
        args:
          - name: timestamp
      - names: ["--no-color"]
        description: Produce monochrome output
      - names: ["--no-log-prefix"]
        description: Don't print prefix in logs
    args:
      - name: service
        variadic: true

  - name: ps
    description: List containers
    options:
      - names: ["-a", "--all"]
        description: Show all stopped containers
      - names: ["-q", "--quiet"]
        description: Only display IDs
      - names: ["--services"]
        description: Display services
      - names: ["--format"]
        description: "Format output (pretty|json)"
        args:
          - name: format
      - names: ["--filter"]
        description: Filter by property
        args:
          - name: filter
      - names: ["--status"]
        description: Filter by status
        args:
          - name: status
    args:
      - name: service
        variadic: true

  - name: exec
    description: Execute a command in a running container
    options:
      - names: ["-d", "--detach"]
        description: Detached mode
      - names: ["-e", "--env"]
        description: Set environment variables
        args:
          - name: KEY=VALUE
      - names: ["-u", "--user"]
        description: Run as user
        args:
          - name: user
      - names: ["-w", "--workdir"]
        description: Working directory
        args:
          - name: dir
      - names: ["--privileged"]
        description: Give extended privileges
      - names: ["-T", "--no-TTY"]
        description: Disable pseudo-TTY allocation
      - names: ["--index"]
        description: Index of container if multiple instances
        args:
          - name: int
    args:
      - name: service
      - name: command
        variadic: true

  - name: run
    description: Run a one-off command on a service
    options:
      - names: ["-d", "--detach"]
        description: Run container in background
      - names: ["--rm"]
        description: Automatically remove container when exits
      - names: ["-e", "--env"]
        description: Set environment variables
        args:
          - name: KEY=VALUE
      - names: ["-u", "--user"]
        description: Run as user
        args:
          - name: user
      - names: ["-w", "--workdir"]
        description: Working directory
        args:
          - name: dir
      - names: ["--entrypoint"]
        description: Override entrypoint
        args:
          - name: cmd
      - names: ["--no-deps"]
        description: Don't start linked services
      - names: ["-p", "--publish"]
        description: Publish ports
        args:
          - name: port
      - names: ["-l", "--label"]
        description: Add label
        args:
          - name: KEY=VALUE
      - names: ["-T", "--no-TTY"]
        description: Disable pseudo-TTY
      - names: ["-v", "--volume"]
        description: Bind mount volume
        args:
          - name: volume
      - names: ["--service-ports"]
        description: Enable service's ports
      - names: ["--use-aliases"]
        description: Use network aliases
      - names: ["--quiet-pull"]
        description: Quiet pull
      - names: ["--name"]
        description: Assign container name
        args:
          - name: name
    args:
      - name: service
      - name: command
        variadic: true

  - name: start
    description: Start services
    args:
      - name: service
        variadic: true

  - name: stop
    description: Stop services
    options:
      - names: ["-t", "--timeout"]
        description: Shutdown timeout in seconds
        args:
          - name: int
    args:
      - name: service
        variadic: true

  - name: restart
    description: Restart service containers
    options:
      - names: ["-t", "--timeout"]
        description: Shutdown timeout in seconds
        args:
          - name: int
    args:
      - name: service
        variadic: true

  - name: pull
    description: Pull service images
    options:
      - names: ["-q", "--quiet"]
        description: Pull without printing progress
      - names: ["--ignore-pull-failures"]
        description: Ignore images with pull failures
      - names: ["--include-deps"]
        description: Also pull services declared as dependencies
    args:
      - name: service
        variadic: true

  - name: push
    description: Push service images
    options:
      - names: ["--ignore-push-failures"]
        description: Push what it can, ignore failures
    args:
      - name: service
        variadic: true

  - name: rm
    description: Remove stopped service containers
    options:
      - names: ["-f", "--force"]
        description: Don't ask to confirm removal
      - names: ["-s", "--stop"]
        description: Stop containers before removing
      - names: ["-v", "--volumes"]
        description: Remove anonymous volumes
    args:
      - name: service
        variadic: true

  - name: kill
    description: Force stop service containers
    options:
      - names: ["-s", "--signal"]
        description: Signal to send (default SIGKILL)
        args:
          - name: signal
    args:
      - name: service
        variadic: true

  - name: pause
    description: Pause services
    args:
      - name: service
        variadic: true

  - name: unpause
    description: Unpause services
    args:
      - name: service
        variadic: true

  - name: images
    description: List images used by the created containers
    options:
      - names: ["-q", "--quiet"]
        description: Only display IDs
    args:
      - name: service
        variadic: true

  - name: top
    description: Display the running processes
    args:
      - name: service
        variadic: true

  - name: events
    description: Receive real time events from containers
    options:
      - names: ["--json"]
        description: Output events as a stream of json objects
    args:
      - name: service
        variadic: true

  - name: ls
    description: List running compose projects
    options:
      - names: ["-a", "--all"]
        description: Show all stopped Compose projects
      - names: ["-q", "--quiet"]
        description: Only display IDs
      - names: ["--filter"]
        description: Filter output
        args:
          - name: filter
      - names: ["--format"]
        description: "Format output (pretty|json)"
        args:
          - name: format

  - name: config
    description: Parse, resolve and render compose file to canonical format
    options:
      - names: ["--format"]
        description: "Output format (yaml|json)"
        args:
          - name: format
      - names: ["--hash"]
        description: Print service config hash
        args:
          - name: hash
      - names: ["--images"]
        description: Print image names
      - names: ["--services"]
        description: Print service names
      - names: ["--volumes"]
        description: Print volume names
      - names: ["--profiles"]
        description: Print profile names
      - names: ["-q", "--quiet"]
        description: "Only validate, don't print"
      - names: ["--resolve-image-digests"]
        description: Pin image tags to digests
      - names: ["--no-interpolate"]
        description: Don't interpolate environment variables
      - names: ["--no-normalize"]
        description: Don't normalize compose model
      - names: ["-o", "--output"]
        description: Save to file
        args:
          - name: file
    args:
      - name: service
        variadic: true

  - name: cp
    description: Copy files/folders between service container and local filesystem
    options:
      - names: ["-a", "--archive"]
        description: Archive mode (copy all uid/gid information)
      - names: ["-L", "--follow-link"]
        description: Always follow symbol link in SRC_PATH
      - names: ["--index"]
        description: Index of container if multiple instances
        args:
          - name: int
    args:
      - name: source path
      - name: dest path

  - name: create
    description: Creates containers for a service
    options:
      - names: ["--build"]
        description: Build images before starting
      - names: ["--force-recreate"]
        description: Recreate containers
      - names: ["--no-build"]
        description: Don't build an image
      - names: ["--no-recreate"]
        description: Don't recreate existing containers
    args:
      - name: service
        variadic: true

  - name: port
    description: Print the public port for a port binding
    options:
      - names: ["--protocol"]
        description: TCP or UDP
        args:
          - name: proto
      - names: ["--index"]
        description: Container index
        args:
          - name: int
    args:
      - name: service
      - name: private_port

  - name: version
    description: Show the Docker Compose version information
    options:
      - names: ["-f", "--format"]
        description: "Format output (pretty|json)"
        args:
          - name: format
      - names: ["--short"]
        description: Show only version number

options:
  - names: ["-f", "--file"]
    description: Compose configuration files
    args:
      - name: file
        template: filesystem
  - names: ["-p", "--project-name"]
    description: Project name
    args:
      - name: name
  - names: ["--profile"]
    description: Specify a profile to enable
    args:
      - name: profile
  - names: ["--env-file"]
    description: Specify alternate environment file
    args:
      - name: file
        template: filesystem
  - names: ["--project-directory"]
    description: Specify alternate working directory
    args:
      - name: dir
        template: folder
  - names: ["--ansi"]
    description: "Control ANSI output (never|always|auto)"
    args:
      - name: string
  - names: ["--compatibility"]
    description: Run in backward compatibility mode
  - names: ["-v", "--version"]
    description: Show version
  - names: ["--verbose"]
    description: Show more output
  - names: ["-H", "--host"]
    description: Daemon socket to connect to
    args:
      - name: HOST
  - names: ["--tls"]
    description: Use TLS
  - names: ["--tlscacert"]
    description: Trust certs signed by CA
    args:
      - name: CA_PATH
  - names: ["--tlscert"]
    description: Path to TLS certificate file
    args:
      - name: CLIENT_CERT_PATH
  - names: ["--tlskey"]
    description: Path to TLS key file
    args:
      - name: TLS_KEY_PATH
  - names: ["--tlsverify"]
    description: Use TLS and verify remote
  - names: ["--skip-hostname-check"]
    description: Don't check daemon's hostname
