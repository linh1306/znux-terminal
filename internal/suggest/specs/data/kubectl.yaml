name: kubectl
subcommands:
  - name: get
    description: Display resources
    options:
      - names: ["-o", "--output"]
        description: "Output format (yaml/json/wide)"
      - names: ["-A", "--all-namespaces"]
        description: All namespaces
      - names: ["-n", "--namespace"]
        description: Namespace
      - names: ["-w", "--watch"]
        description: Watch for changes
      - names: ["--show-kind"]
        description: Show resource kind
      - names: ["-l", "--selector"]
        description: Label selector

  - name: describe
    description: Show details of resources
    options:
      - names: ["-A", "--all-namespaces"]
        description: All namespaces
      - names: ["-n", "--namespace"]
        description: Namespace

  - name: apply
    description: Apply configuration
    options:
      - names: ["-f", "--filename"]
        description: Filename or URL
      - names: ["-k", "--kustomize"]
        description: Kustomize directory
      - names: ["--dry-run"]
        description: Dry run
      - names: ["--validate"]
        description: Validate resources

  - name: delete
    description: Delete resources
    options:
      - names: ["-f", "--filename"]
        description: Filename or URL
      - names: ["--all"]
        description: Delete all resources
      - names: ["--cascade"]
        description: Cascade delete

  - name: create
    description: Create resources
    options:
      - names: ["-f", "--filename"]
        description: Filename or URL
      - names: ["--dry-run"]
        description: Dry run

  - name: edit
    description: Edit resources
    options:
      - names: ["--output"]
        description: Output format

  - name: logs
    description: Print logs
    options:
      - names: ["-f", "--follow"]
        description: Follow logs
      - names: ["-p", "--previous"]
        description: Previous container
      - names: ["--tail"]
        description: Lines to show
      - names: ["-c", "--container"]
        description: Container name

  - name: exec
    description: Execute command in container
    options:
      - names: ["-it"]
        description: Interactive
      - names: ["-c", "--container"]
        description: Container name

  - name: port-forward
    description: "Forward port(s)"
    options:
      - names: ["--address"]
        description: Bind address

  - name: scale
    description: Scale a deployment
    options:
      - names: ["--replicas"]
        description: Number of replicas

  - name: rollout
    description: Manage rollout
    options:
      - names: ["status"]
        description: Check rollout status
      - names: ["undo"]
        description: Undo previous rollout
      - names: ["restart"]
        description: Restart deployment

  - name: top
    description: Show resource usage
    options:
      - names: ["-A", "--all-namespaces"]
        description: All namespaces
      - names: ["-n", "--namespace"]
        description: Namespace

  - name: explain
    description: Explain resource definitions

  - name: config
    description: Manage config
    options:
      - names: ["use-context"]
        description: Switch context
      - names: ["get-contexts"]
        description: List contexts
      - names: ["current-context"]
        description: Current context

  - name: cluster
    description: Manage cluster
    options:
      - names: ["info"]
        description: Cluster info

  - name: api-resources
    description: List API resources
    options:
      - names: ["--api-group"]
        description: API group
      - names: ["-o", "--output"]
        description: Output format
